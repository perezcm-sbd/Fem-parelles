<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Destí (una mica ajudat)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1B1035; --card2:#2A1B4A; --gold:#E8B54E; --rose:#E85D75; --cream:#F5EFE6; --muted:#B9A9D9;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif;
  min-height:100%; display:flex; align-items:center; justify-content:center;
  padding:24px; padding-top:calc(24px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background-image: radial-gradient(circle at 15% 10%, rgba(232,181,78,.10), transparent 45%), radial-gradient(circle at 85% 90%, rgba(232,93,117,.12), transparent 45%);
}
.card{
  width:100%; max-width:420px; background:var(--card2); border-radius:18px; padding:32px 28px;
  border:1px dashed rgba(232,181,78,.45); position:relative;
}
.card::before,.card::after{
  content:""; position:absolute; top:50%; width:20px; height:20px; background:var(--bg); border-radius:50%; transform:translateY(-50%);
}
.card::before{left:-10px;} .card::after{right:-10px;}
h1{
  font-family:'Playfair Display',serif; font-size:26px; line-height:1.25; margin:0 0 6px;
}
p.sub{ color:var(--muted); font-size:14px; margin:0 0 24px; line-height:1.5; }
label{ display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
select, textarea, button{
  width:100%; font-family:inherit; font-size:15px; border-radius:10px; border:1px solid rgba(245,239,230,.18);
  background:rgba(0,0,0,.2); color:var(--cream); padding:12px 14px;
}
textarea{ min-height:140px; resize:vertical; line-height:1.6; }
select{ appearance:none; }
button{
  margin-top:16px; background:var(--gold); color:#20122f; font-weight:600; border:none; cursor:pointer;
  transition:transform .15s ease;
}
button:hover{ transform:translateY(-1px); }
button.secondary{
  background:transparent; color:var(--muted); border:1px solid rgba(245,239,230,.2); font-weight:500; margin-top:10px;
}
.hidden{ display:none !important; }
.loading{ text-align:center; padding:20px 0; color:var(--muted); font-size:14px; min-height:24px; }
.reveal{ text-align:center; padding:8px 0; }
.reveal .pct{ display:inline-block; background:rgba(232,181,78,.15); color:var(--gold); font-weight:600; font-size:13px; padding:4px 12px; border-radius:999px; margin-bottom:14px; }
.reveal .names{ font-family:'Playfair Display',serif; font-size:24px; line-height:1.4; }
.reveal .names b{ color:var(--rose); }
.footlink{ text-align:center; margin-top:18px; font-size:13px; color:var(--muted); cursor:pointer; text-decoration:underline; }
.msg{ font-size:13px; color:var(--muted); margin-top:10px; min-height:18px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div id="content">Carregant...</div>
</div>
 
<script>
let db = null, userCap = null, isOwner = false;
let pairs = [];
 
function namesFromPairs(){
  const s = new Set();
  pairs.forEach(p => { s.add(p.a); s.add(p.b); });
  return [...s];
}
function partnerOf(name){
  const p = pairs.find(p => p.a === name || p.b === name);
  if(!p) return null;
  return p.a === name ? p.b : p.a;
}
function hashPct(a,b){
  const str = [a,b].sort().join('|');
  let h = 0;
  for(const ch of str) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  return 92 + (h % 8); // 92-99
}
 
function renderAdmin(){
  const existing = pairs.map(p => `${p.a}, ${p.b}`).join('\n');
  document.getElementById('content').innerHTML = `
    <h1>Configura les parelles</h1>
    <p class="sub">Una línia per parella, separades per coma. Això és el que decideix qui surt amb qui — l'"algorisme" només ho amaga.</p>
    <label for="ta">Parelles</label>
    <textarea id="ta" placeholder="Anna, Marc&#10;Laia, Jordi&#10;Pau, Nuri">${existing}</textarea>
    <div class="msg" id="msg"></div>
    <button id="save">Desar parelles</button>
    ${pairs.length ? '<button class="secondary" id="toPublic">Anar a la vista pública</button>' : ''}
  `;
  document.getElementById('save').onclick = savePairs;
  const toPublic = document.getElementById('toPublic');
  if(toPublic) toPublic.onclick = renderPublic;
}
 
async function savePairs(){
  const raw = document.getElementById('ta').value;
  const msg = document.getElementById('msg');
  const parsed = raw.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const [a,b] = l.split(',').map(s=>s && s.trim());
    return (a && b) ? {a,b} : null;
  }).filter(Boolean);
  if(!parsed.length){ msg.textContent = 'Cal almenys una parella vàlida (Nom, Nom).'; return; }
  pairs = parsed;
  if(db){
    try{
      await db.doc('config/pairs').set({ pairs, updatedAt: Date.now() });
      msg.textContent = 'Desat. Ja pots compartir l\'enllaç.';
    }catch(e){ msg.textContent = 'No s\'ha pogut desar (torna-ho a provar).'; return; }
  }
  renderPublic();
}
 
function renderPublic(){
  const names = namesFromPairs().sort((a,b)=>a.localeCompare(b));
  document.getElementById('content').innerHTML = `
    <h1>El Destí (una mica ajudat)</h1>
    <p class="sub">Tria el teu nom i descobreix qui t'ha tocat, segons un algorisme totalment imparcial.</p>
    <label for="who">El teu nom</label>
    <select id="who">${names.map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
    <button id="go">Descobreix la teva parella</button>
    <div id="area"></div>
    ${isOwner ? '<div class="footlink" id="toAdmin">Editar parelles</div>' : ''}
  `;
  document.getElementById('go').onclick = reveal;
  const toAdmin = document.getElementById('toAdmin');
  if(toAdmin) toAdmin.onclick = renderAdmin;
}
 
function reveal(){
  const name = document.getElementById('who').value;
  const area = document.getElementById('area');
  const steps = ['Analitzant personalitat...', 'Comparant gustos...', 'Consultant els astres...', 'Calculant compatibilitat...'];
  let i = 0;
  area.innerHTML = `<div class="loading">${steps[0]}</div>`;
  const iv = setInterval(()=>{
    i++;
    if(i < steps.length){ area.querySelector('.loading').textContent = steps[i]; }
  }, 550);
  setTimeout(()=>{
    clearInterval(iv);
    const partner = partnerOf(name);
    if(!partner){ area.innerHTML = '<div class="msg">No trobat a la llista.</div>'; return; }
    const pct = hashPct(name, partner);
    area.innerHTML = `
      <div class="reveal">
        <div class="pct">${pct}% de compatibilitat</div>
        <div class="names">${name} &amp; <b>${partner}</b></div>
      </div>`;
  }, 550*steps.length + 300);
}
 
async function init(){
  try{ userCap = await claude.use('user'); }catch(e){ userCap = null; }
  try{ db = await claude.use('db'); }catch(e){ db = null; }
  try{ isOwner = userCap ? !!userCap.isOwner() : false; }catch(e){ isOwner = false; }
 
  if(db){
    try{
      const doc = await db.doc('config/pairs').get();
      if(doc && doc.data && Array.isArray(doc.data.pairs)) pairs = doc.data.pairs;
    }catch(e){ /* no config yet */ }
  }
 
  if(!pairs.length){
    if(isOwner){ renderAdmin(); }
    else{ document.getElementById('content').innerHTML = '<h1>Encara no hi ha parelles</h1><p class="sub">Qui ha creat aquesta pàgina encara no ha configurat les parelles.</p>'; }
  } else {
    renderPublic();
  }
}
init();
</script>
</body>
</html>
