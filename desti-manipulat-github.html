<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Destí (una mica ajudat)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1B1035; --card2:#2A1B4A; --gold:#E8B54E; --rose:#E85D75; --cream:#F5EFE6; --muted:#B9A9D9;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif;
  min-height:100%; display:flex; align-items:center; justify-content:center;
  padding:24px; padding-top:calc(24px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background-image: radial-gradient(circle at 15% 10%, rgba(232,181,78,.10), transparent 45%), radial-gradient(circle at 85% 90%, rgba(232,93,117,.12), transparent 45%);
}
.card{
  width:100%; max-width:420px; background:var(--card2); border-radius:18px; padding:32px 28px;
  border:1px dashed rgba(232,181,78,.45); position:relative;
}
.card::before,.card::after{
  content:""; position:absolute; top:50%; width:20px; height:20px; background:var(--bg); border-radius:50%; transform:translateY(-50%);
}
.card::before{left:-10px;} .card::after{right:-10px;}
h1{ font-family:'Playfair Display',serif; font-size:26px; line-height:1.25; margin:0 0 6px; }
p.sub{ color:var(--muted); font-size:14px; margin:0 0 24px; line-height:1.5; }
label{ display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
select, button{
  width:100%; font-family:inherit; font-size:15px; border-radius:10px; border:1px solid rgba(245,239,230,.18);
  background:rgba(0,0,0,.2); color:var(--cream); padding:12px 14px;
}
select{ appearance:none; }
button{
  margin-top:16px; background:var(--gold); color:#20122f; font-weight:600; border:none; cursor:pointer;
  transition:transform .15s ease;
}
button:hover{ transform:translateY(-1px); }
.loading{ text-align:center; padding:20px 0; color:var(--muted); font-size:14px; min-height:24px; }
.reveal{ text-align:center; padding:8px 0; }
.reveal .pct{ display:inline-block; background:rgba(232,181,78,.15); color:var(--gold); font-weight:600; font-size:13px; padding:4px 12px; border-radius:999px; margin-bottom:14px; }
.reveal .names{ font-family:'Playfair Display',serif; font-size:24px; line-height:1.4; }
.reveal .names b{ color:var(--rose); }
.msg{ font-size:13px; color:var(--muted); margin-top:10px; min-height:18px; }
</style>
</head>
<body>
<div class="card">
  <div id="content"></div>
</div>

<script>
/* =========================================================
   EDITA AQUESTA LLISTA ABANS DE PUBLICAR-HO A GITHUB.
   Una entrada { a, b } per parella. Aquesta és tota la
   "configuració" — no hi ha cap panell d'administració
   perquè la pàgina és estàtica un cop penjada.
========================================================= */
const PAIRS = [
  { a: "Anna",  b: "Marc" },
  { a: "Laia",  b: "Jordi" },
  { a: "Pau",   b: "Nuri" },
];
/* ========================================================= */

function namesFromPairs(){
  const s = new Set();
  PAIRS.forEach(p => { s.add(p.a); s.add(p.b); });
  return [...s].sort((a,b)=>a.localeCompare(b));
}
function partnerOf(name){
  const p = PAIRS.find(p => p.a === name || p.b === name);
  return p ? (p.a === name ? p.b : p.a) : null;
}
function hashPct(a,b){
  const str = [a,b].sort().join('|');
  let h = 0;
  for(const ch of str) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  return 92 + (h % 8); // 92-99
}

function renderPublic(){
  const names = namesFromPairs();
  document.getElementById('content').innerHTML = `
    <h1>El Destí (una mica ajudat)</h1>
    <p class="sub">Tria el teu nom i descobreix qui t'ha tocat, segons un algorisme totalment imparcial.</p>
    <label for="who">El teu nom</label>
    <select id="who">${names.map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
    <button id="go">Descobreix la teva parella</button>
    <div id="area"></div>
  `;
  document.getElementById('go').onclick = reveal;
}

function reveal(){
  const name = document.getElementById('who').value;
  const area = document.getElementById('area');
  const steps = ['Analitzant personalitat...', 'Comparant gustos...', 'Consultant els astres...', 'Calculant compatibilitat...'];
  let i = 0;
  area.innerHTML = `<div class="loading">${steps[0]}</div>`;
  const iv = setInterval(()=>{
    i++;
    if(i < steps.length){ area.querySelector('.loading').textContent = steps[i]; }
  }, 550);
  setTimeout(()=>{
    clearInterval(iv);
    const partner = partnerOf(name);
    if(!partner){ area.innerHTML = '<div class="msg">No trobat a la llista.</div>'; return; }
    const pct = hashPct(name, partner);
    area.innerHTML = `
      <div class="reveal">
        <div class="pct">${pct}% de compatibilitat</div>
        <div class="names">${name} &amp; <b>${partner}</b></div>
      </div>`;
  }, 550*steps.length + 300);
}

if(!PAIRS.length){
  document.getElementById('content').innerHTML = '<h1>Encara no hi ha parelles</h1><p class="sub">Edita la llista PAIRS dins del codi de la pàgina.</p>';
} else {
  renderPublic();
}
</script>
</body>
</html>
